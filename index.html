<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explora la imagen astronómica del día de la NASA y guarda tus favoritas.">
  <title>Explorador APOD</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Spectral:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="container py-4 text-center">
    <h1 class="h2">Explorador de la foto astronómica del día</h1>
    <p class="mb-0">Astronomy Picture of the Day (APOD) de la NASA</p>
  </header>
  <main class="container pb-5">
    <div class="row g-4">
      <div class="col-lg-8">
        <section class="d-flex gap-2 mb-3" aria-label="Buscar una foto por fecha">
          <label class="visually-hidden" for="fecha">Fecha de la foto</label>
          <input type="date" id="fecha" class="form-control" min="1995-06-16">
          <button id="btnBuscar" class="btn border" type="button">Buscar</button>
        </section>
        <div id="error" role="alert" aria-live="polite"></div>
        <div id="resultado" aria-live="polite"></div>
      </div>
      <aside class="col-lg-4">
        <button id="btn-favorito" class="btn border w-100 mb-2" type="button">⭐ Guardar en favoritos</button>
        <p id="mensaje-favorito" aria-live="polite"></p>
        <section>
          <h2 class="h5 mt-3">Favoritos</h2>
          <ul id="lista-favoritos" class="list-group"></ul>
        </section>
      </aside>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/es.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
